<!-- แผน 2: แบบจิ้มเลือกทีละกล่อง (รองรับ Tailwind CSS) -->

    <script>
        const highwayData = {
            "42": ["นาจวก - ดอนยาง", "ดอนยาง - บ้านดี", "บ้านดี - ปาลัส", "ปาลัส - กอตอ"],
            "43": ["ปาแด - มะพร้าวต้นเดียว", "มะพร้าวต้นเดียว - ปูยุดบารู", "ปูยุดบารู - ตันหยงลิมอ", "ตันหยงลิมอ - บ้านดี"],
            "409": ["นาเกตุ - ป่าพ้อ"],
            "410": ["ปัตตานี - ยะลา"],
            "418": ["งาแม่ - ยุโป"],
            "4060": ["สายบุรี - กะรุบี"],
            "4061": ["ยะรัง - สะกำ", "สะกำ - ปะนาเระ"],
            "4071": ["วังพญา - พิเทน"],
            "4074": ["กะลาพอ - ปากู"],
            "4075": ["ตอหลัง - บ้านนอก"],
            "4076": ["บ้านใหม่ - ปาเซปูเต๊ะ"],
            "4092": ["จะรังตาดง - มายอ"],
            "4157": ["ละหาร - บางเก่า", "บางเก่า - ปะนาเระ"],
            "4167": ["ป่าไหม้ - ไทรทอง"],
            "4168": ["ปะลุกาสาเมาะ - ตะโละดือรามัน"],
            "4296": ["งาแม่ - ดอนรัก"],
            "4297": ["ทางเข้าบ้านดี"],
            "4298": ["ทางเข้าโรงพยาบาลยะหริ่ง"],
            "4299": ["ทางเข้าสายบุรี"],
            "4324": ["ทางเข้าปะนาเระ"],
            "4334": ["ทางเข้าบางมะรวด"],
            "4335": ["ทางเข้าหาดแฆแฆ"],
            "4336": ["ทางเข้าชมวิว"],
            "4337": ["ป่าไหม้ - แยกชมวิว"],
            "4354": ["ทางเข้าดอนรัก"],
            "4355": ["ทางเข้ารามโกมุท"],
            "4356": ["ทางเข้านาเกลือ"],
            "4357": ["ทางเข้ามัสยิดกรือเซะ"],
            "4358": ["ทางเข้าบือเจาะ"],
            "4359": ["ทางเข้าบางปู"]
        };
        function setTodayDate() {
            const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            const today = new Date();
            const date = today.getDate();
            const month = months[today.getMonth()];
            const year = today.getFullYear() + 543;
            document.getElementById('display-date').innerText = `วันที่ ${date} ${month} ${year}`;
        }
        setTodayDate();
        function initRouteDropdown() {
            const routeSelect = document.getElementById("route-select");
            if (routeSelect) {
                for (const hw in highwayData) {
                    const option = document.createElement("option");
                    option.value = hw;
                    option.text = "ทล." + hw;
                    routeSelect.appendChild(option);
                }
            }
        }
        function updateSectionDropdown() {
            const route = document.getElementById("route-select").value;
            const sectionSelect = document.getElementById("section-select");
            sectionSelect.innerHTML = '<option value="">-- เลือกตอน --</option>';
            if (route && highwayData[route]) {
                highwayData[route].forEach(function(sec) {
                    const option = document.createElement("option");
                    option.value = sec;
                    option.text = sec;
                    sectionSelect.appendChild(option);
                });
            }
            updateText();
        }
        function changeTemplate() {
            const selectedImage = document.getElementById('unit-select').value;
            document.getElementById('bg-image').src = selectedImage;
            adjustScale();
        }
        function adjustFontSize(element, maxFontSize, minFontSize) {
            if (!element) return;

            const box = document.getElementById('info-box-overlay');
            const maxWidth = box ? box.offsetWidth - 40 : 700;

            let fontSize = maxFontSize;
            element.style.fontSize = fontSize + 'px';

            while (element.scrollWidth > maxWidth && fontSize > minFontSize) {
                fontSize -= 1;
                element.style.fontSize = fontSize + 'px';
            }
        }
        function updateText() {                
            try {
                let taskInput = document.getElementById('task-name');
                let kmInput = document.getElementById('km-text');
                let routeSelect = document.getElementById('route-select');
                let sectionSelect = document.getElementById('section-select');

                let task = taskInput ? taskInput.value : '';                
                let km = kmInput ? kmInput.value : '';
                let routeVal = routeSelect ? routeSelect.value : '';                
                let sectionVal = sectionSelect ? sectionSelect.value : '';
				
                // 💡 [แก้ไข] แยกสายทาง กับ ตอน ออกจากกันเด็ดขาด
                let routeText = '-';
                let sectionText = '-';

                // 💡 ถ้ามีการเลือกสายทาง ให้ "แทนที่" ค่าเดิม (ห้ามใช้ +=)
                if (routeVal !== '') {                    
                    routeText = 'ทางหลวงหมายเลข ' + routeVal;
                }
                
                // 💡 ถ้ามีการเลือกตอน ให้ "แทนที่" ค่าเดิม (ห้ามใช้ +=)
                if (sectionVal !== '') {
                    sectionText = 'ตอน ' + sectionVal;
                }
                

                task = task || '-';                
                km = km || '-';

                const elTask = document.getElementById('display-task');
                const elRoute = document.getElementById('display-route');
				const elSection = document.getElementById('display-section'); // 💡 ดึงอ็อบเจกต์ใหม่
                const elKm = document.getElementById('display-km');

                elTask.innerText = task;
                elRoute.innerText = routeText;
				elSection.innerText = sectionText; // 💡 โยนค่าลงไป
                elKm.innerText = km;

				// 💡 สั่งปรับขนาดตัวอักษรอัตโนมัติ (เผื่อชื่อตอนยาวเกินไป)
                adjustFontSize(elTask, 30, 24);
                adjustFontSize(elRoute, 28, 22);
				adjustFontSize(elSection, 28, 22);
                adjustFontSize(elKm, 28, 22);

                setTimeout(() => {
                    adjustFontSize(elTask, 30, 24);
                    adjustFontSize(elRoute, 28, 22);
					adjustFontSize(elSection, 28, 22);
                    adjustFontSize(elKm, 28, 22);
                }, 50);

            } catch (error) {                
                console.log("พบปัญหาการอัปเดตข้อความ:", error);		
            }
        }
        function handleImages() {
            // ดึงข้อมูล input ทั้ง 4 ช่องมาเตรียมไว้
            const fileInputs = [
                document.getElementById('file1'),
                document.getElementById('file2'),
                document.getElementById('file3'),
                document.getElementById('file4')
            ];
            
            const grid = document.getElementById('image-grid');
            grid.innerHTML = ''; 
            grid.className = ''; 
            
            let validFiles = []; // เก็บเฉพาะไฟล์ที่ถูกเลือกจริงๆ
            
            // 💡 ขั้นตอนที่ 1: โชว์รูปพรีวิวในกล่อง 1-2-3-4
            fileInputs.forEach((input, index) => {
                const num = index + 1;
                const imgElem = document.getElementById('prev' + num);
                const textElem = document.getElementById('text' + num);
                
                if (input.files && input.files[0]) {
                    const file = input.files[0];
                    validFiles.push(file); // ส่งไฟล์เข้าคิวไปทำรายงาน
                    
                    // อ่านรูปมาโชว์ในกล่องฟอร์ม
                    const readerLocal = new FileReader();
                    readerLocal.onload = function(e) {
                        imgElem.src = e.target.result;
                        imgElem.classList.remove('hidden'); // โชว์รูป
                        textElem.classList.add('hidden');   // ซ่อนข้อความ 📷
                    }
                    readerLocal.readAsDataURL(file);
                } else {
                    // ถ้ายังไม่มีรูป ให้กลับไปโชว์ข้อความเหมือนเดิม
                    imgElem.src = '';
                    imgElem.classList.add('hidden');
                    textElem.classList.remove('hidden');
                }
            });

            // 💡 ขั้นตอนที่ 2: เอารูปที่เลือกมาจัดเรียงลงในใบรายงาน (image-grid) แบบล็อคตำแหน่ง (แก้พิษกู่)
            const limit = validFiles.length;
            if (limit === 0) return; // ถ้าไม่มีรูปเลย ไม่ต้องทำอะไร

            if (limit === 3) grid.classList.add('three-images');
            if (limit === 2) grid.classList.add('two-images');
            
            for (let i = 0; i < limit; i++) {
                const file = validFiles[i];
                
                // สร้างกล่องและรูป "จองที่" ทิ้งไว้ในใบรายงานเลย
                const wrapper = document.createElement('div');
                wrapper.className = 'img-wrapper';
                const img = document.createElement('img');
                img.className = 'uploaded-img';
                
                wrapper.appendChild(img);
                grid.appendChild(wrapper); // แปะลงกระดาษ 100% ตรงคิวแน่นอน

                // ค่อยให้อ่านไฟล์มาแทรกลงในกล่องที่จองไว้
                const readerGrid = new FileReader();
                readerGrid.onload = function(e) {
                    img.src = e.target.result; 
                }
                readerGrid.readAsDataURL(file);
            }
        }
        function adjustScale() {
            const wrapper = document.getElementById('template-wrapper');
            const container = document.getElementById('template-container');
            const wrapperWidth = wrapper.clientWidth;
            if (wrapperWidth < 800) {
                const scale = wrapperWidth / 800;
                container.style.transform = `scale(${scale})`;
                wrapper.style.height = (container.offsetHeight * scale) + 'px';
            } else {
                container.style.transform = 'none';
                wrapper.style.height = 'auto';
            }
        }
        
        async function exportImage(action = 'download') {
            const container = document.getElementById('template-container');
            
            if (document.fonts && document.fonts.ready) {
                await document.fonts.ready;
                await new Promise(resolve => setTimeout(resolve, 500));
            }
            
            // ป้องกันปัญหาตำแหน่งเพี้ยนตอนเซฟรูปบนมือถือ
            const originalTransform = container.style.transform;
            container.style.transform = 'none';
            await new Promise(resolve => setTimeout(resolve, 100));
            
            html2canvas(container, {
                scale: window.devicePixelRatio || 2,
                useCORS: true,
                allowTaint: false,
                logging: false,
                letterRendering: true, 
                windowWidth: 800,
                scrollY: 0,
                onclone: function(clonedDoc) {
                    const clonedContainer = clonedDoc.getElementById('template-container');
                    const clonedDate = clonedDoc.getElementById('date-overlay');
                    if (clonedDate) {
                        clonedDate.style.fontSize = '32px';
                        clonedDate.style.top = '130px';
                        clonedDate.style.left = '0';
                        clonedDate.style.width = '100%';
                        clonedDate.style.height = '44px';
                        clonedDate.style.display = 'flex';
                        clonedDate.style.justifyContent = 'center';
                        clonedDate.style.alignItems = 'center';
                        clonedDate.style.transform = 'none';
                    }
                }
            }).then(canvas => {
                container.style.transform = originalTransform;
                
                canvas.toBlob(async (blob) => {
                    if (!blob) return;
                    const fileName = `รายงานประจำวัน_${new Date().toLocaleDateString('th-TH').replace(/\//g, '-')}.jpg`;
                    
                    if (action === 'share' && navigator.share) {
                        const file = new File([blob], fileName, { type: 'image/jpeg' });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            try {
                                await navigator.share({
                                    files: [file]
                                });
                                return; 
                            } catch (error) {
                                console.log('ผู้ใช้ยกเลิกการแชร์ หรือ Share API ล้มเหลว:', error);
                            }
                        }
                    }

                    const imageDataUrl = canvas.toDataURL('image/jpeg', 0.95);
                    const link = document.createElement('a');
                    link.download = fileName;
                    link.href = imageDataUrl;
                    link.click();
                    
                }, 'image/jpeg', 0.95);
            }).catch(err => {
                container.style.transform = originalTransform;
                console.error("เกิดข้อผิดพลาดในการสร้างรูป:", err);
            });
        }

        window.addEventListener('DOMContentLoaded', function() {
            initRouteDropdown();
            updateText();
        });
        window.addEventListener('load', adjustScale);
        window.addEventListener('resize', adjustScale);
    </script>
</body>
</html>
